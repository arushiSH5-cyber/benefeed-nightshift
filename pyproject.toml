[project]
name = "benefeed-nightshift"
version = "0.1.0"
description = "Benefeed Night Shift: server (Replit) and runner (Mac next to PhoneUse)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "pywebpush==2.0.1",
]

[dependency-groups]
runner = [
  "langgraph==0.2.62",
  "langgraph-checkpoint-sqlite==2.0.1",
  "langchain-anthropic==0.3.1",
  "langsmith==0.2.10",
  "playwright==1.49.1",
]
dev = ["pytest==8.3.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
